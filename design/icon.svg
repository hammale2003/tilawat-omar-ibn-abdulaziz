<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24806B"/>
      <stop offset="1" stop-color="#17584A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="#C9A227" stroke-opacity="0.35" stroke-width="3"/>

  <!-- eight-point star: two squares, one rotated 45 degrees -->
  <g fill="none" stroke="#E3C56B" stroke-width="9" stroke-linejoin="round">
    <polygon points="406,256 256,406 106,256 256,106"/>
    <polygon points="362,362 150,362 150,150 362,150"/>
  </g>
  <g fill="#E3C56B" fill-opacity="0.10">
    <polygon points="406,256 256,406 106,256 256,106"/>
    <polygon points="362,362 150,362 150,150 362,150"/>
  </g>

  <!-- inner medallion -->
  <circle cx="256" cy="256" r="62" fill="#0E3D33" stroke="#E3C56B" stroke-width="4"/>
</svg>
